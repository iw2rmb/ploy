parameters:
  - in: path
    name: job_id
    required: true
    schema: { type: string }

get:
  tags: [Control]
  summary: Download the original Grype JSON for a pre-gate or post-gate job
  description: |
    Requires control-plane authentication. The auth_token query parameter is
    accepted for download links. Available outputs from failed gates can also
    be downloaded. A missing output returns 404, including outputs from an
    earlier execution of a retried job. Reports are limited to 64 MiB uncompressed.
  parameters:
    - in: query
      name: auth_token
      schema: { type: string }
  responses:
    '200':
      description: JSON download with Content-Disposition attachment
      content:
        application/json:
          schema:
            type: object
    '400':
      description: Invalid job ID or unsupported job type
    '401':
      description: Authentication required
    '403':
      description: Control-plane role required
    '404':
      description: Job, report, or pre-gate baseline unavailable
    '500':
      description: Invalid stored report or internal server error
