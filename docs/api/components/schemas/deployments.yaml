JVMVersionsResponse:
  type: object
  required: [versions]
  additionalProperties: false
  properties:
    versions:
      type: array
      uniqueItems: true
      description: |
        Every distinct observed set for coordinates selected by the for parameter, sorted
        lexicographically. An empty array means no observation matched.
        Ordering expresses neither popularity nor compatibility.
      items:
        type: array
        minItems: 1
        uniqueItems: true
        description: |
          Complete observed set of group:artifact@version values for coordinates
          selected by the for parameter, sorted lexicographically. Each coordinate preserves every
          observed version. Constraints in with do not appear in the returned sets.
        items:
          type: string
      example:
        - ["ru.tinkoff.top.core:top-tracing-starter@1.6.1"]
