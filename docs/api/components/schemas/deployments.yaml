JVMVersionsResponse:
  type: object
  required: [versions]
  additionalProperties: false
  properties:
    versions:
      type: array
      uniqueItems: true
      description: |
        Complete matching observations, sorted lexicographically by found followed
        by with. Identical complete objects collapse. Objects with identical found
        arrays and different with arrays remain separate. An empty array means
        no observation matched. Ordering expresses neither popularity nor compatibility.
      items:
        type: object
        required: [found, with]
        additionalProperties: false
        properties:
          found:
            type: array
            uniqueItems: true
            description: |
              Every observed group:artifact@version value for each for coordinate
              in one matching observation, sorted lexicographically.
              A null version uses an empty suffix, such as group:artifact@.
            items:
              type: string
          with:
            type: array
            uniqueItems: true
            description: |
              Every matching group:artifact@version value for each with coordinate
              in the same observation, sorted lexicographically. Exact, masked,
              and unversioned selectors contribute actual observed versions.
              An omitted with parameter produces an empty array.
              A null version uses an empty suffix, such as group:artifact@.
            items:
              type: string
      example:
        - found: ["ru.tinkoff.top.core:top-tracing-starter@1.6.1"]
          with: ["org.springframework.boot:spring-boot@3.3.0"]
