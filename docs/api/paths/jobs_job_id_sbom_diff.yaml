parameters:
  - in: path
    name: job_id
    required: true
    schema: { type: string }

get:
  tags: [Control]
  summary: Download dependency changes between this post-gate and its pre-gate baseline
  description: |
    Requires control-plane authentication. The auth_token query parameter is
    accepted for download links. The baseline is the pre-gate from the same
    run, repository, and attempt. Failed gates can supply either outcome.
    The diff uses stored module rows when available. For legacy or empty SBOMs
    it reads the named SPDX report from the corresponding execution. A missing
    required report returns 404. Reports are limited to 64 MiB uncompressed.
    Each change includes package, version_pre, version_post, and change
    (added, removed, or changed). When both sides have known module membership,
    changes include module_id. Historical comparisons with unattributed packages
    use aggregate package sets. An empty diff returns an empty packages array.
  parameters:
    - in: query
      name: auth_token
      schema: { type: string }
  responses:
    '200':
      description: JSON download with Content-Disposition attachment
      content:
        application/json:
          schema:
            $ref: "../components/schemas/controlplane.yaml#/JobSBOMDiffResponse"
    '400':
      description: Invalid job ID or unsupported job type
    '401':
      description: Authentication required
    '403':
      description: Control-plane role required
    '404':
      description: Job, report, or pre-gate baseline unavailable
    '500':
      description: Invalid stored report or internal server error
