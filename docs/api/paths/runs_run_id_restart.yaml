post:
  tags: [Control]
  summary: Restart a run
  description: |
    Restarts a terminal run by atomically incrementing its attempt, clearing
    prior run stats, creating the new job chain, and setting it to `Running`.
    Active runs and runs whose owning wave is `Cancelled` return `409 Conflict`.
    A Queued or Running run for the same repository also blocks a restart,
    regardless of branch or mig project. The error message includes the
    repository URL and current Run ID.
    With `from_failed: true`, the run must contain a failed job after a successful
    prefix. `Cancelled` runs qualify only when their successors were cancelled
    after that failure. The transaction keeps the
    attempt and successful jobs, queues the failed job, restores its cancelled,
    unexecuted successors to `Created`, and increments `stats.resume_count`.
    The retry stays on the original node and requires its retained workspace.
    Partial workspace edits are preserved. Missing workspace fails the job;
    it does not trigger source hydration. Invalid chains return `409 Conflict`.
    Current logs, metrics, SBOM rows, and results for retried jobs are cleared;
    uploaded artifact bundles are retained.
    The optional request body can provide a request-only ephemeral GitLab token
    for the restarted attempt.
  parameters:
    - in: path
      name: run_id
      required: true
      schema: { type: string }
      description: Run ID (KSUID string)
  requestBody:
    required: false
    content:
      application/json:
        schema:
          $ref: "../components/schemas/controlplane.yaml#/RunRestartRequest"
  responses:
    "200":
      description: Updated run summary.
      content:
        application/json:
          schema:
            $ref: "../components/schemas/controlplane.yaml#/RunSummary"
    "400":
      description: Bad request.
      content:
        application/json:
          schema:
            $ref: "../components/schemas/common.yaml#/Error"
    "404":
      description: Run not found.
      content:
        application/json:
          schema:
            $ref: "../components/schemas/common.yaml#/Error"
    "409":
      description: Run is active, the owning wave is cancelled, or the repository has another active run (error includes current Run ID).
      content:
        application/json:
          schema:
            $ref: "../components/schemas/common.yaml#/Error"
    "500":
      description: Internal server error.
      content:
        application/json:
          schema:
            $ref: "../components/schemas/common.yaml#/Error"
