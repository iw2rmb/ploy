get:
  tags: [Control]
  summary: Find observed JVM dependency combinations
  operationId: getJVMVersions
  description: |
    Returns dependency combinations observed in Tech Radar software bills of
    materials (SBOMs). Accepts the job, control-plane, and cli-admin roles.

    The server searches JVM observations whose SBOM created_at is at or after
    the cutoff nine calendar months before the Trino query starts, using UTC.
    The created_at field records when the SBOM file was created. Each observation
    is one (commit_sha, created_at, module_id) group across tenants and projects.
    Every requested coordinate and constraint must occur within that observation.

    The server includes an observation when at least one JVM metadata row matches
    its exact commit SHA. The metadata
    type must be jvm_version_yml, jvm_version_dockerfile, jvm_version_gradle,
    jvm_version_maven, or java_version. The value must equal the requested JVM's
    decimal string exactly. For JVM 21, the matching value is '21'. The matching
    metadata row's created_at must be at or after the same cutoff.

    Each object in versions contains two required arrays of group:artifact@version
    strings from one matching observation. The found array contains every observed
    version of each for coordinate. The with array contains every matching version
    of each with coordinate, including exact, masked, and unversioned selectors.
    An unversioned selector contributes every observed version of its coordinate.
    A masked selector contributes only versions matching its literal prefix.
    A null version uses an empty suffix, such as group:artifact@.
    Multiple matching versions remain together within their observation.

    The server sorts and deduplicates each array lexicographically. It deduplicates
    complete objects using both arrays, then sorts objects by found followed by with.
    Objects with identical found arrays and different with arrays remain separate.
    An omitted with parameter produces an empty with array. Neither array is null
    or omitted. No matches return {"versions":[]}. Results include every distinct
    matching object without truncation or partial results.

    SBOM observations can combine dependency configurations, including test
    and tools dependencies. Results establish co-occurrence, not a resolved
    runtime classpath, deployment success, or runtime compatibility. The JVM
    filter uses the reported JVM major for the commit.

    Use with for the migration's fixed dependency baseline and the jvm path
    parameter for its JVM major. Treat returned versions as candidates for
    application validation.
    Preserve the baseline and rerun the failing check after a version change.

    The server trims list items and deduplicates identical items. Empty items,
    malformed coordinates, repeated parameters, unknown parameter names, and
    an explicitly empty optional parameter produce 400. A group:artifact coordinate
    cannot occur in both for and with. The with list permits one selector per
    coordinate. Different selectors for the same coordinate produce 400 before
    lookup, including unversioned entries combined with exact or masked entries.
    Coordinates with the same artifact name and different groups are distinct.

    The with parameter accepts group:artifact, group:artifact@version,
    group:artifact@M.x.x, and group:artifact@M.N.x. M and N contain one or more
    ASCII decimal digits; their spelling is preserved. Masks match literal dotted
    prefixes: 4.x.x matches 4., and 4.0.x matches 4.0. Qualifiers such as
    4.0.7-RC1 and 4.0.7-SNAPSHOT match. The mask 4.x.x also matches 4.0 and 4.foo,
    but excludes 40.1. The mask 4.0.x excludes 4.01.1.
    Standalone lowercase x dot-components are reserved for these two mask forms.
    Other forms containing those components, including 4.x and 4.x.7, produce 400.
    An empty version after @ produces 400. Other versions use opaque exact
    matching; wildcard and range characters have no special meaning.
    URL-encode query values, including literal + characters in versions.

    Each lookup uses the request context with a 60-second timeout. Request
    cancellation cancels upstream work. The route permits two driver cancellation
    attempts, each bounded by 30 seconds, and five seconds for the response.
    Its write deadline is 125 seconds after lookup starts. The global HTTP
    timeout remains unchanged. Errors use plain text without upstream details
    or credentials. A timeout remains 504 when upstream cancellation fails.
  parameters:
    - name: jvm
      in: path
      required: true
      description: |
        One positive integer JVM major. Non-integer, non-positive, and
        comma-separated values are invalid. Query parameters cannot supply the JVM.
      schema:
        type: integer
        format: int64
        minimum: 1
      example: 21
    - name: for
      in: query
      required: true
      description: |
        Nonempty comma-separated group:artifact coordinates. Every coordinate
        must occur in a matching observation. These coordinates cannot occur in with.
      schema:
        type: string
        minLength: 1
      example: ru.tinkoff.top.core:top-tracing-starter
    - name: with
      in: query
      required: false
      description: |
        Comma-separated group:artifact constraints with optional @version,
        @M.x.x, or @M.N.x selectors. Every constraint must match in the same
        observation. An explicitly empty value is invalid. Each coordinate permits
        one selector and cannot occur in for. The response's with array contains
        actual observed versions matching these selectors.
      schema:
        type: string
        minLength: 1
      examples:
        exact:
          value: org.springframework.boot:spring-boot@3.3.0
        majorMask:
          value: org.springframework.boot:spring-boot@3.x.x
        minorMask:
          value: org.springframework.boot:spring-boot@3.3.x
        unversioned:
          value: org.springframework.boot:spring-boot
  responses:
    "200":
      description: Complete matching observations, or an empty versions array when none match.
      content:
        application/json:
          schema:
            $ref: "../components/schemas/deployments.yaml#/JVMVersionsResponse"
          examples:
            exact:
              value:
                versions:
                  - found: ["ru.tinkoff.top.core:top-tracing-starter@1.6.1"]
                    with: ["org.springframework.boot:spring-boot@3.3.0"]
            masked:
              summary: A 3.3.x constraint preserves observations with different matched versions.
              value:
                versions:
                  - found: ["ru.tinkoff.top.core:top-tracing-starter@1.6.1"]
                    with: ["org.springframework.boot:spring-boot@3.3.0"]
                  - found: ["ru.tinkoff.top.core:top-tracing-starter@1.6.1"]
                    with: ["org.springframework.boot:spring-boot@3.3.1"]
            unversioned:
              summary: An unversioned constraint includes every observed version in one observation.
              value:
                versions:
                  - found: ["ru.tinkoff.top.core:top-tracing-starter@1.6.1"]
                    with: ["org.springframework.boot:spring-boot@3.3.0", "org.springframework.boot:spring-boot@3.3.1"]
            withoutConstraints:
              value:
                versions:
                  - found: ["ru.tinkoff.top.core:top-tracing-starter@1.6.1"]
                    with: []
            noMatches:
              value:
                versions: []
    "400":
      description: Invalid JVM path value or query parameters.
      content:
        text/plain:
          schema:
            type: string
    "401":
      description: Authentication is required.
    "403":
      description: The caller lacks access to JVM version lookups.
    "502":
      description: Trino authentication, permission, transport, or query failure.
      content:
        text/plain:
          schema:
            type: string
    "503":
      description: Either Trino credential is missing.
      content:
        text/plain:
          schema:
            type: string
    "504":
      description: The lookup deadline expired, including when cancellation fails.
      content:
        text/plain:
          schema:
            type: string
