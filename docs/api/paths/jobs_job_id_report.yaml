post:
  operationId: saveJobReport
  tags: [Jobs]
  summary: Replace a job's text report
  description: |
    Worker-only endpoint. Requires the assigned node's identity and PLOY_NODE_UUID.
    Stores raw UTF-8 text in jobs.meta.report, preserving whitespace and newlines.
    Each POST replaces the report; an empty body clears it. Reports remain readable
    after completion through job status and run jobs. Concurrent completion preserves
    the latest report. The request limit is 1 MiB; NUL characters are not accepted.
  parameters:
    - in: path
      name: job_id
      required: true
      schema: {type: string}
    - in: header
      name: PLOY_NODE_UUID
      required: true
      schema: {type: string}
  requestBody:
    required: false
    content:
      text/plain:
        schema: {type: string}
  responses:
    '204':
      description: Report replaced or cleared
    '400':
      description: Invalid ID, node header, or text encoding
    '401':
      description: Authentication required
    '403':
      description: Caller is not an authorized worker or the job belongs to another node
    '404':
      description: Job not found
    '413':
      description: Report exceeds 1 MiB
    '500':
      description: Report could not be saved
