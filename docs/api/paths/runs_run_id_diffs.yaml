get:
  tags: [Artifacts]
  summary: List or download diffs for a run
  description: >-
    With download=true and accumulated=true, replay the committed patch history
    against the original source snapshot and return one gzipped source-to-result
    patch. Retained attempts include their earlier committed prefix. The result
    combines the stored patches without verifying equality with the node's final
    repository tree. Missing patch blobs and failed replay return errors.
  responses:
    "200":
      description: Diff list or patch stream.
    "409":
      description: Source snapshot or patch history could not be reconstructed into a run patch.
