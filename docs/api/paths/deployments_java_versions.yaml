get:
  tags: [Control]
  summary: Find observed Java dependency combinations
  operationId: getJavaVersions
  description: |
    Returns dependency combinations observed in Tech Radar software bills of
    materials (SBOMs). Requires the control-plane role; cli-admin includes this role.

    The server searches all retained JVM observations. Each observation is one
    (tenant, project, commit_sha, module_id, created_at) group. Every requested
    coordinate and constraint must occur within that observation. The server
    excludes rows with null tenant, project, module, or snapshot time, and rows
    with empty coordinates, versions, or commit SHAs.

    The server matches java_version metadata by tenant, project = repository,
    and exact nonempty commit SHA. All matching metadata rows must contain the
    requested positive decimal integer after whitespace trimming. Missing,
    invalid, or conflicting metadata excludes the observation. Other Java
    metadata types do not participate in this filter.

    Each returned set contains every distinct version selected by for within
    one matching observation. The server preserves multiple versions of one
    coordinate. The server sorts each set lexicographically, deduplicates
    identical sets, and sorts the resulting sets lexicographically. Results
    include every distinct matching set without truncation or partial results.

    SBOM observations can combine dependency configurations, including test
    and tools dependencies. Results establish co-occurrence, not a resolved
    runtime classpath, deployment success, or runtime compatibility. The JDK
    filter uses the reported repository JDK major for the commit.

    Use with for the migration's fixed dependency baseline and jdk for its JDK
    major. Treat returned versions as candidates for application validation.
    Preserve the baseline and rerun the failing check after a version change.

    The server trims list items and deduplicates identical items. Empty items,
    malformed coordinates, repeated parameters, unknown parameter names, and
    an explicitly empty optional parameter produce 400. Package versions are
    opaque exact strings; ranges and wildcard matching are unsupported.
    URL-encode query values, including literal + characters in versions.

    Each lookup uses the request context with a 60-second timeout. Request
    cancellation cancels upstream work. The route permits two driver cancellation
    attempts, each bounded by 30 seconds, and five seconds for the response.
    Its write deadline is 125 seconds after lookup starts. The global HTTP
    timeout remains unchanged. Errors use plain text without upstream details
    or credentials. A timeout remains 504 when upstream cancellation fails.
  parameters:
    - name: for
      in: query
      required: true
      description: |
        Nonempty comma-separated group:artifact coordinates. Every coordinate
        must occur in a matching observation. A coordinate can also occur in with.
      schema:
        type: string
        minLength: 1
      example: example:client,example:starter
    - name: with
      in: query
      required: false
      description: |
        Comma-separated group:artifact@version constraints. Every constraint
        must occur in the same observation. An explicitly empty value is invalid.
      schema:
        type: string
        minLength: 1
      example: org.springframework.boot:spring-boot@4.0.7
    - name: jdk
      in: query
      required: true
      description: |
        One positive integer JDK major. Missing, empty, non-integer,
        non-positive, and comma-separated values are invalid.
      schema:
        type: integer
        minimum: 1
      example: 21
  responses:
    "200":
      description: Complete observed dependency sets, or an empty array when none match.
      content:
        application/json:
          schema:
            $ref: "../components/schemas/techradar.yaml#/JavaVersionsResponse"
          examples:
            matches:
              value:
                versions:
                  - ["example:client@1.2.0", "example:starter@2.0.1"]
                  - ["example:client@1.3.0", "example:starter@2.0.2"]
            noMatches:
              value:
                versions: []
    "400":
      description: Invalid query parameters.
      content:
        text/plain:
          schema:
            type: string
    "401":
      description: Authentication is required.
    "403":
      description: The caller lacks control-plane access.
    "502":
      description: Trino authentication, permission, transport, or query failure.
      content:
        text/plain:
          schema:
            type: string
    "503":
      description: Either Trino credential is missing.
      content:
        text/plain:
          schema:
            type: string
    "504":
      description: The lookup deadline expired, including when cancellation fails.
      content:
        text/plain:
          schema:
            type: string
