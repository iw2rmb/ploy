JavaVersionsResponse:
  type: object
  required: [versions]
  additionalProperties: false
  properties:
    versions:
      type: array
      uniqueItems: true
      description: |
        Every distinct observed set for the requested coordinates, sorted
        lexicographically. An empty array means no observation matched.
        Ordering expresses neither popularity nor compatibility.
      items:
        type: array
        minItems: 1
        uniqueItems: true
        description: |
          Complete observed set of group:artifact@version values, sorted
          lexicographically. Multiple versions of one coordinate are preserved.
        items:
          type: string
      example:
        - ["example:client@1.2.0", "example:starter@2.0.1"]
        - ["example:client@1.3.0", "example:starter@2.0.2"]
